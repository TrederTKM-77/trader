<!doctype html>
<html lang="tk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRADER</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f4f6fb;--card:#ffffff;--text:#0f172a;--muted:#64748b;--chip:#e6edf9;--on:#2f80ed;--on-text:#ffffff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1621;--card:#17212b;--text:#e8eef6;--muted:#8da2b5;--chip:#233140;--on:#3b8cf0;--on-text:#ffffff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1621;--card:#17212b;--text:#e8eef6;--muted:#8da2b5;--chip:#233140;--on:#3b8cf0;--on-text:#ffffff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px 14px 110px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:14px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;border-radius:12px;background:var(--chip);color:var(--text);font:600 15px system-ui,sans-serif;padding:12px 6px;cursor:pointer}
.row .chip{padding:12px 18px}
.chip.on{background:var(--on);color:var(--on-text)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.go{width:100%;border:0;border-radius:14px;background:var(--on);color:var(--on-text);font:700 17px system-ui,sans-serif;padding:15px}
.note{color:var(--muted);font-size:12px;text-align:center;margin:8px 0 0}
</style>
</head>
<body>
<h1>📈 TRADER</h1>
<p class="sub">Walýutany we wagty saýla, soň SIGNAL bas</p>
<div class="card"><h2>Walýuta</h2><div class="grid" id="pairs"></div></div>
<div class="card"><h2>Wagt</h2><div class="row" id="tfs"></div></div>
<div class="bar">
  <button class="go" id="go"></button>
  <p class="note">⚠️ Maslahat däl. Signal ýeňiş kepil bermeýär.</p>
</div>
<script>
var BOT = "tkmtreydin2027_bot";
var PAIRS = ["EURUSD","GBPUSD","USDJPY","AUDUSD","USDCAD","USDCHF","NZDUSD","EURJPY","GBPJPY","EURGBP","BTCUSD","ETHUSD","GOLD"];
var TFS = ["1m","5m","15m","30m","1h"];
var sel = {pair:"EURUSD", tf:"5m"};
try {
  var saved = JSON.parse(localStorage.getItem("trader_sel") || "null");
  if (saved && PAIRS.indexOf(saved.pair) > -1 && TFS.indexOf(saved.tf) > -1) sel = saved;
} catch (e) {}
var tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

function chips(id, list, key) {
  var box = document.getElementById(id);
  box.innerHTML = "";
  list.forEach(function (v) {
    var b = document.createElement("button");
    b.className = "chip" + (sel[key] === v ? " on" : "");
    b.textContent = v;
    b.onclick = function () { sel[key] = v; render(); };
    box.appendChild(b);
  });
}
function render() {
  chips("pairs", PAIRS, "pair");
  chips("tfs", TFS, "tf");
  document.getElementById("go").textContent = "📊 SIGNAL: " + sel.pair + " · " + sel.tf;
  try { localStorage.setItem("trader_sel", JSON.stringify(sel)); } catch (e) {}
}
document.getElementById("go").onclick = function () {
  var link = "https://t.me/" + BOT + "?start=" + sel.pair + "_" + sel.tf;
  if (tg && tg.openTelegramLink) { tg.openTelegramLink(link); }
  else { window.location.href = link; }
};
render();
</script>
</body>
</html>
